plugins { id 'com.android.application' }

def mapleFontSourceDir = rootProject.file("../iOS/MapleBrowser/Fonts")
def mapleFontAssetDir = file("$projectDir/src/main/assets/fonts")

tasks.register("syncMapleFonts", Copy) {
    from(mapleFontSourceDir)
    include "PlusJakartaSans-Regular.ttf", "PlusJakartaSans-Bold.ttf"
    into(mapleFontAssetDir)
}

def minSdkVersion = 22

android {
    namespace 'net.teamceleste.maple'
    compileSdk 35

    defaultConfig {
        applicationId 'net.teamceleste.maple'
        minSdk minSdkVersion
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named("preBuild").configure { dependsOn("syncMapleFonts") }

dependencies { }
