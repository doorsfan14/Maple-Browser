name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: |
          rm -rf MapleBrowser.xcodeproj
          xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -e
          xcodebuild             -project iOS/MapleBrowser.xcodeproj             -scheme MapleBrowser             -sdk iphoneos             -configuration Release             IPHONEOS_DEPLOYMENT_TARGET=13.0             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package IPA
        run: |
          set -e
          mkdir -p artifacts/Payload
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/Maple Browser.app" -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/
          test -f "artifacts/Payload/Maple Browser.app/MapleBrowser"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "artifacts/Payload/Maple Browser.app/Info.plist" | grep -qx "MapleBrowser"
          cd artifacts
          /usr/bin/zip -qry MapleBrowser-iOS.ipa Payload
          cd ..
          unzip -l artifacts/MapleBrowser-iOS.ipa
          test -s artifacts/MapleBrowser-iOS.ipa

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: MapleBrowser-iOS
          path: artifacts/MapleBrowser-iOS.ipa
