name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select available Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          rm -rf iOS/MapleBrowser.xcodeproj
          xcodegen generate --spec iOS/project.yml --project iOS/MapleBrowser.xcodeproj

      - name: Build unsigned iOS app
        run: |
          set -e
          xcodebuild             -project iOS/MapleBrowser.xcodeproj             -scheme MapleBrowser             -sdk iphoneos             -configuration Release             IPHONEOS_DEPLOYMENT_TARGET=13.0             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package build
        run: |
          set -e
          mkdir -p artifacts
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/Maple Browser.app" -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/MapleBrowser-iOS13-unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: MapleBrowser-iOS13-unsigned
          path: artifacts/MapleBrowser-iOS13-unsigned.zip
