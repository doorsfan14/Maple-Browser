name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 (iOS 18 SDK)
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== iPhoneOS SDK ==="
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -ge 26 ]; then
            echo "ERROR: Refusing to build Maple Browser with an iOS 26+ SDK."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iOS
        run: |
          rm -rf MapleBrowser.xcodeproj
          xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          echo "Building with:"
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcodebuild \
            -project iOS/MapleBrowser.xcodeproj \
            -scheme MapleBrowser \
            -sdk iphoneos \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_NAME=MapleBrowser \
            build

      - name: Validate app bundle
        run: |
          set -euo pipefail

          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/MapleBrowser.app" -print -quit)"
          test -n "$APP_PATH"

          APP="$APP_PATH"
          EXEC="$APP/MapleBrowser"

          test -d "$APP"
          test -f "$EXEC"
          test -x "$EXEC"

          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" | grep -qx "MapleBrowser"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -qx "net.teamceleste.maple"
          /usr/libexec/PlistBuddy -c "Print :CFBundlePackageType" "$APP/Info.plist" | grep -qx "APPL"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" | grep -qx "13.0"

          file "$EXEC"
          lipo -info "$EXEC"

          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/Payload

          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/MapleBrowser.app" -print -quit)"
          test -n "$APP_PATH"

          ditto "$APP_PATH" "artifacts/Payload/MapleBrowser.app"

          cd artifacts
          /usr/bin/zip -r -X MapleBrowser-iOS.ipa Payload
          cd ..

          test -s artifacts/MapleBrowser-iOS.ipa
          unzip -t artifacts/MapleBrowser-iOS.ipa
          unzip -l artifacts/MapleBrowser-iOS.ipa | grep -F "Payload/MapleBrowser.app/MapleBrowser"
          unzip -p artifacts/MapleBrowser-iOS.ipa Payload/MapleBrowser.app/Info.plist > /tmp/MapleBrowser-Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" /tmp/MapleBrowser-Info.plist | grep -qx "MapleBrowser"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /tmp/MapleBrowser-Info.plist | grep -qx "net.teamceleste.maple"

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: MapleBrowser-iOS
          path: artifacts/MapleBrowser-iOS.ipa
