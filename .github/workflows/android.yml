name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android 5.1 compatibility check
        run: |
          test -f android/gradle.properties
          grep -q "android.injected.build.model.only.versioned=3" android/gradle.properties || true
          grep -q "minSdk=22" android/gradle.properties
      - name: Build Android
        run: |
          cd android
          ./gradlew assembleDebug
