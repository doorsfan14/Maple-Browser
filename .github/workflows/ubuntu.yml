name: Ubuntu validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - name: Test MapleCore
        run: swift test
